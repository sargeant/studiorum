coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 50%  # Lower threshold for exception handling and logging improvements
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "scripts/"
  - "docs/"
  - "**/__pycache__/"
  - "build/"
  - "dist/"
