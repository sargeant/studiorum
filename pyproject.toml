[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studiorum"
version = "0.6.0"
description = "Convert 5e JSON data to beautifully formatted LaTeX/PDF documents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sam Sargeant" }]
keywords = [
    "dnd",
    "5e",
    "5e-compatible",
    "5e",
    "latex",
    "pdf",
    "cli",
    "generator",
    "rpg",
    "tabletop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "colorlog>=6.0.0,<7.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "lark>=1.2.2,<2.0.0",
    "diskcache>=5.6.3,<6.0.0",
    "pillow>=11.3.0",
    "aiohttp>=3.12.15",
    "watchdog>=6.0.0,<7.0.0",
    "fastmcp>=3,<4",
    "logfire>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/sargeant/studiorum"
Repository = "https://github.com/sargeant/studiorum"
"Bug Tracker" = "https://github.com/sargeant/studiorum/issues"

[project.scripts]
studiorum = "studiorum.cli.main:app"

[project.optional-dependencies]
observability = ["logfire[system-metrics]>=0.54.0", "structlog>=25.0.0"]

[dependency-groups]
dev = [
    "ruff>=0.12.2,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "rg>=0.0.75,<1.0.0",
    "semver>=3.0.4,<4.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "hypothesis>=6.98.0,<7.0.0",
    "psutil>=5.9.0,<8.0.0",
    "types-pyyaml>=6.0.12.20250516",
    "types-psutil>=7.0.0.20250601",
    "diskcache-stubs>=5.6.3",
    "certifi>=2025.7.14",
    "coverage>=7.10.1,<8.0.0",
    "starlette>=1.3.1,<2.0.0",
    "pip-audit>=2.6.0,<3.0.0",
    "bandit>=1.8.6,<2.0.0",
    "pylint>=3.3.8",
    "libcst>=1.8.2",
    "bowler>=0.9.0",
    "rope>=1.14.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.30.0",
    "pymdown-extensions>=10.16.1",
    "mkdocstrings-python>=1.17.0",
    "deadcode>=2.4.1",
    "pyright>=1.1.400",
    "import-linter>=2.15",
    "syrupy>=6.1.1",
]

images = ["Pillow>=9.0.0"]
xml = ["lxml>=4.9.0"]
llm = [
    # MCP stdio proxy to bridge HTTP MCP servers into stdio for Codex/CLI
    "mcp-proxy>=0.2.0",
]
scripts = [
    "orjson>=3.11.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studiorum"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    # "ASYNC", # asyncio-related checks
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "ISC",  # flake8-implicit-str-concat
    "S110", # try-except-pass
    "S112", # try-except-continue
    "T201", # print
    # "S",     # flake8-bandit
    # "FBT",   # flake8-boolean-trap
    # "N",     # pep8-naming
    # "DTZ",   # flake8-datetimez
    # "EXE",   # flake8-executable
    # "LOG",   # flake8-logging
    # "G",     # flake8-logging-format
    # "INP",   # flake8-no-pep420
    # "PYI",   # flake8-pyi
    # "PT",    # flake8-pytest-style
    # "Q",     # flake8-quotes
    # "SLF",   # flake8-self
    # "DOC",   # pydoclint
    # "D",     # docstring checks
    # "PLE",   # pylint-like checks
    # "EM",    # flake8-errmsg
    # "T",     # typing checks
    # "ANN",   # type annotations
    # "Q",     # quality checks

]
ignore = [
    "B008",    # function calls in argument defaults (common in typer CLI apps)
    "C401",    # generator expression improvements
    "C414",    # unnecessary list calls
    "C417",    # unnecessary map usage
    "UP015",   # unnecessary mode arguments
    "W291",    # trailing whitespace
    "PLW0603", # global used in various places
    "S101",    # use of assert in tests
    "E501",    # line too long
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]  # command-line scripts print by design

