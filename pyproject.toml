[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5e2pdf"
version = "0.2.0"
description = "Convert D&D 5e JSON data to beautifully formatted LaTeX/PDF documents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sam Sargeant" }]
dependencies = [
    "requests>=2.31.0",
    # "beautifulsoup4>=4.12.0",
    "colorlog>=6.0.0",
    # "GetOptions>=1.0.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.2",
    "lark>=1.2.2",
    "mypy",
    "rg>=0.0.75",
    "semver>=3.0.4",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "psutil>=5.9.0",          # For memory usage testing
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
    "packaging",
]
images = ["Pillow>=9.0.0"]
xml = ["lxml>=4.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dnd5e"]

[project.scripts]
5e2pdf = "dnd5e.cli.main:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    # "ASYNC", # asyncio-related checks
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    # "S",     # flake8-bandit
    # "FBT",   # flake8-boolean-trap
    # "N",     # pep8-naming
    # "DTZ",   # flake8-datetimez
    # "EXE",   # flake8-executable
    # "ISC",   # flake8-implicit-str-concat
    # "LOG",   # flake8-logging
    # "G",     # flake8-logging-format
    # "INP",   # flake8-no-pep420
    # "PYI",   # flake8-pyi
    # "PT",    # flake8-pytest-style
    # "Q",     # flake8-quotes
    # "RET",   # flake8-return
    # "SLF",   # flake8-self
    # "SIM",   # flake8-simplify
    # "PTH",   # flake8-pathlib
    # "PERF",  # flake8-performance
    # "DOC",   # pydoclint
    # "D",     # docstring checks
    # "PLE",   # pylint-like checks
    # "EM",    # flake8-errmsg
    # "T",     # typing checks
    # "ANN",   # type annotations
    # "Q",     # quality checks

]
ignore = [
    "E722",    # bare except clause
    "B008",    # function calls in argument defaults (common in typer CLI apps)
    "B904",    # raise from within except without explicit exception chaining
    "B007",    # unused loop variables
    "F401",    # unused imports (will clean up separately)
    "C401",    # generator expression improvements
    "C414",    # unnecessary list calls
    "C417",    # unnecessary map usage
    "UP015",   # unnecessary mode arguments
    "W291",    # trailing whitespace
    "PLW0603", # global used in various places
    "S101",    # use of assert in tests
    "E501",    # line too long
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff.lint.isort]
known-first-party = ["dnd5e"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=dnd5e",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "stress: marks tests as stress tests for validation",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
