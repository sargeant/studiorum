[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5e2pdf"
version = "2.0.0"
description = "Convert D&D 5e JSON data to beautifully formatted LaTeX/PDF documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "5e2pdf contributors"}
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "colorlog>=6.0.0",
    "GetOptions>=1.0.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff", 
    "mypy",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
images = [
    "Pillow>=9.0.0",
]
xml = [
    "lxml>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
5e2pdf = "src.cli.main:app"
json2tex = "src.json2tex:main"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true