[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5e2pdf"
version = "2.0.0"
description = "Convert D&D 5e JSON data to beautifully formatted LaTeX/PDF documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sam Sargeant"}
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "colorlog>=6.0.0",
    "GetOptions>=1.0.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff>=0.12.2",
    "lark>=1.2.2",
    "mypy",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "psutil>=5.9.0",  # For memory usage testing
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
]
images = [
    "Pillow>=9.0.0",
]
xml = [
    "lxml>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
5e2pdf = "src.cli.main:app"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "E722", # bare except clause
    "B008", # function calls in argument defaults (common in typer CLI apps)
    "B904", # raise from within except without explicit exception chaining
    "B007", # unused loop variables
    "F401", # unused imports (will clean up separately)
    "UP006", # dict/list instead of Dict/List (gradual migration)
    "UP007", # X | Y instead of Union[X, Y] (gradual migration)
    #"UP045", # X | None instead of Optional[X] (gradual migration)
    "C401", # generator expression improvements
    "C414", # unnecessary list calls
    "C417", # unnecessary map usage
    "UP015", # unnecessary mode arguments
    "W291", # trailing whitespace
]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "stress: marks tests as stress tests for validation",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.2",
    "lark>=1.2.2",
    "mypy",
    "psutil>=5.9.0",  # For memory usage testing

]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.0.2",
]
