[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studiorum"
version = "0.5.0"
description = "Convert 5e JSON data to beautifully formatted LaTeX/PDF documents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sam Sargeant" }]
keywords = [
    "dnd",
    "5e",
    "5e-compatible",
    "5e",
    "latex",
    "pdf",
    "cli",
    "generator",
    "rpg",
    "tabletop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "colorlog>=6.0.0,<7.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "lark>=1.2.2,<2.0.0",
    "diskcache>=5.6.3,<6.0.0",
    "pillow>=11.3.0",
    "aiohttp>=3.12.15",
    "watchdog>=6.0.0,<7.0.0",
    "fastmcp>=2.11.3",
    "logfire>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/sargeant/studiorum"
Repository = "https://github.com/sargeant/studiorum"
"Bug Tracker" = "https://github.com/sargeant/studiorum/issues"

[project.scripts]
studiorum = "studiorum.cli.main:app"

[project.optional-dependencies]
docs = [
    "sphinx==8.2.3",                # Pin to latest Sphinx version
    "sphinx-autobuild>=2024.0.0",   # Modern Awesome theme
    "myst-parser==4.0.1",           # Pin to MyST 4.0.1 exactly
    "sphinxcontrib-mermaid>=0.9.2", # Mermaid support
    "sphinx-copybutton>=0.5.2",     # Copy buttons for code
    "linkify-it-py>=2.0.0",         # For MyST linkify extension
    "packaging",
    "shibuya>=2025.7.24",
    "sphinx-design>=0.6.1",
]
observability = [
    "logfire[system-metrics]>=0.54.0",
    "structlog>=25.0.0",               # For structured logging compatibility
]

[dependency-groups]
dev = [
    "ruff>=0.12.2,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "rg>=0.0.75,<1.0.0",
    "semver>=3.0.4,<4.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "pytest-json-report>=1.5.0,<2.0.0", # JSON test reports for performance monitoring
    "hypothesis>=6.98.0,<7.0.0", # Property-based testing
    "psutil>=5.9.0,<8.0.0",
    "types-pyyaml>=6.0.12.20250516",
    "types-psutil>=7.0.0.20250601",
    "diskcache-stubs>=5.6.3",
    "certifi>=2025.7.14",
    "coverage>=7.10.1,<8.0.0",
    "starlette>=0.47.2,<1.0.0",
    "pip-audit>=2.6.0,<3.0.0", # Alternative to safety - compatible with Pydantic 2.11+
    # "safety>=3.6.0,<4.0.0",  # Disabled: requires pydantic<2.10.0
    "bandit>=1.8.6,<2.0.0",
    "pylint>=3.3.8",
    "libcst>=1.8.2",
    "bowler>=0.9.0",
    "rope>=1.14.0",
    "mkdocs>=1.6.1",
    "mkdocs-cinder>=1.2.0",
    "mkdocstrings>=0.30.0",
    "pymdown-extensions>=10.16.1",
    "mkdocstrings-python>=1.17.0",
    "deadcode>=2.4.1",
]
docs = ["shibuya>=2025.7.24"]

images = ["Pillow>=9.0.0"]
xml = ["lxml>=4.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/studiorum"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    # "ASYNC", # asyncio-related checks
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    # "S",     # flake8-bandit
    # "FBT",   # flake8-boolean-trap
    # "N",     # pep8-naming
    # "DTZ",   # flake8-datetimez
    # "EXE",   # flake8-executable
    # "ISC",   # flake8-implicit-str-concat
    # "LOG",   # flake8-logging
    # "G",     # flake8-logging-format
    # "INP",   # flake8-no-pep420
    # "PYI",   # flake8-pyi
    # "PT",    # flake8-pytest-style
    # "Q",     # flake8-quotes
    # "RET",   # flake8-return
    # "SLF",   # flake8-self
    # "SIM",   # flake8-simplify
    # "PTH",   # flake8-pathlib
    # "PERF",  # flake8-performance
    # "DOC",   # pydoclint
    # "D",     # docstring checks
    # "PLE",   # pylint-like checks
    # "EM",    # flake8-errmsg
    # "T",     # typing checks
    # "ANN",   # type annotations
    # "Q",     # quality checks

]
ignore = [
    "E722",    # bare except clause
    "B008",    # function calls in argument defaults (common in typer CLI apps)
    "B904",    # raise from within except without explicit exception chaining
    "B007",    # unused loop variables
    "F401",    # unused imports (will clean up separately)
    "C401",    # generator expression improvements
    "C414",    # unnecessary list calls
    "C417",    # unnecessary map usage
    "UP015",   # unnecessary mode arguments
    "W291",    # trailing whitespace
    "PLW0603", # global used in various places
    "S101",    # use of assert in tests
    "E501",    # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["studiorum"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/.*\\.py$"]
# Temporarily disable some strict checks for gradual mypy adoption
disable_error_code = ["no-any-return", "arg-type", "return-value"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=studiorum",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--tb=short",
    "-n",
    "auto",                      # Enable parallel test execution
    "--dist",
    "loadscope",                 # Group tests by module for better isolation
    "--max-worker-restart",
    "1",                         # Force new processes to avoid contamination
    # Note: Enhanced isolation for parallel execution
]
testpaths = ["tests"]
markers = [
    # Speed-based marks (for selective running)
    "fast: marks tests as fast (<1s execution, unit tests)",
    "medium: marks tests as medium (1-10s execution, integration tests)",
    "slow: marks tests as slow (>10s execution, full system tests)",

    # Component-based marks (for focused testing)
    "core: marks tests for core models, loaders, and registry",
    "rendering: marks tests for LaTeX rendering and template processing",
    "cli: marks tests for command-line interface",
    "mcp: marks tests for Model Context Protocol (MCP) server functionality",
    "integration: marks tests as integration tests (cross-component)",

    # Data dependency marks (for environment handling)
    "requires_data: marks tests that need 5etools data sources",
    "requires_latex: marks tests that need LaTeX installation",
    "needs_latex: marks tests that require LaTeX installation and perform real compilation",
    "latex_required: marks tests that require LaTeX installation",
    "network: marks tests that require network access",

    # Quality marks (for CI pipeline control)
    "property_based: marks tests using Hypothesis property testing",
    "performance: marks tests that benchmark performance",
    "security: marks tests that validate security aspects",
    "benchmark: marks tests that run detailed benchmarks",

    # Special marks
    "ci_broken: marks tests that fail in CI environment (skipped in CI)",
    "stress: marks tests as stress tests for validation",
    "xdist_incompatible: marks tests that hang with pytest-xdist (run sequentially)",
    "latex_compilation: marks tests that require LaTeX compilation",
]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.bandit]
# We use inline # nosec comments for specific suppressions rather than global skips
# This provides better documentation and context for each suppression
# The only global skip is B603 which has too many occurrences (23+) to annotate individually
# Note: Bandit may show "nosec encountered but no failed test" warnings - this is a
# known bandit limitation with multi-line constructs and can be safely ignored

# Skip B603 - subprocess without shell=True is secure by design (23+ occurrences)
# Source: https://docs.python.org/3/library/subprocess.html#security-considerations
# "Unlike some other popen functions, this implementation will never
# implicitly call a system shell. This means that all characters,
# including shell metacharacters, can safely be passed to child processes."
# References:
# - OWASP: https://owasp.org/www-community/attacks/Command_Injection
# - OpenStack Security: https://security.openstack.org/guidelines/dg_avoid-shell-true.html
skips = ["B603"]

# All other suppressions use inline # nosec comments with explanations:
# - B404: subprocess imports (4 occurrences) - using secure patterns
# - B101: assert for type narrowing (4 occurrences) - not security assertions
# - B105: "CS" enum value (1 occurrence) - not a password
# - B110: try-except-pass (9 occurrences) - intentional graceful degradation
# - B607: Already resolved via studiorum.core.security module (0 remaining)

exclude_dirs = ["/tests/", "/scripts/"]
