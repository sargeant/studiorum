# Studiorum Documentation - MkDocs Configuration with Material Theme

site_name: Studiorum
site_description: 5e content processing toolkit - LaTeX/PDF generation and MCP integration
site_url: https://studiorum.dev
repo_url: https://github.com/sargeant/studiorum
repo_name: studiorum
edit_uri: edit/develop/docs/
docs_dir: docs
site_author: Studiorum Project

# SEO and metadata
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sargeant/studiorum
      name: Studiorum on GitHub
  generator: false  # Hide "Made with Material for MkDocs" footer
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback! Help us improve by creating an issue.

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Primary colors matching 5e theme
    primary: deep purple
    accent: amber
  font:
    # Use system fonts by default, custom fonts loaded via extra_css
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections

# Custom fonts and styling
extra_css:
  - https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Cabin:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap
  - https://cdn.jsdelivr.net/npm/@githubnext/monaspace@1.000.0/fonts/webfonts/MonaspaceNeon/MonaspaceNeon.css
  - assets/custom-theme.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/plausible-analytics.js

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          options:
            # Documentation
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            # Filtering
            filters: ["!^_", "!^__pycache__"]
            inherited_members: true
            members_order: source
            # Rendering
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: sargeant
      repo: studiorum
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation Structure - Two-Tab Approach
nav:
  - Studiorum: index.md
  - User Guide:
    - user-guide/index.md
    - Quick Start: user-guide/quick-start.md
    - Converting Content: user-guide/converting-content.md
    - MCP Integration: user-guide/mcp-setup.md
    - Troubleshooting: user-guide/troubleshooting.md
    - Known Issues: user-guide/known-issues.md
    - CLI Reference: user-guide/cli-reference.md
  - Developer Guide:
    - developer-guide/index.md
    - Architecture: developer-guide/architecture.md
    - Data Sources: developer-guide/data-sources.md
    - Getting Started: developer-guide/getting-started.md
    - Performance Guidelines: performance-guidelines.md
    - API Reference:
      - developer-guide/api/index.md
      - Core Services: developer-guide/api/services.md
      - Models: developer-guide/api/models.md
      - Renderers: developer-guide/api/renderers.md
    - AI Agent Development: developer-guide/ai-agents.md
    - Contributing: developer-guide/contributing.md
    - Model Usage: developer-guide/models.md
