# Snapshots are compared byte for byte; whitespace hooks must not touch them.
exclude: ^tests/e2e/__snapshots__/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        name: ruff (linter)
        args: [--fix]
      - id: ruff-format
        name: ruff (formatter)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml  # Add TOML validation
      - id: check-json  # Add JSON validation
  - repo: local
    hooks:
      # The project's environment, so imports resolve as they do in make mypy
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: template-legacy-render-check
        name: Template legacy render check
        entry: scripts/pre-commit-template-guard.sh
        language: script
        files: ^src/studiorum/render/templates/.*\.tex\.j2$
      - id: srd-compliance
        name: SRD compliance check
        entry: scripts/pre-commit-compliance.sh
        language: script
        files: \.(py|md|yml|yaml|toml)$
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports --no-logo
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
