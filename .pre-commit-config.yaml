repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        name: ruff (linter)
        args: [--fix]
      - id: ruff-format
        name: ruff (formatter)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml  # Add TOML validation
      - id: check-json  # Add JSON validation
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0  # Add mypy type checking
    hooks:
      - id: mypy
        additional_dependencies: [types-pyyaml, types-psutil, pydantic]
        args: [--ignore-missing-imports]
        language_version: python3.12
        files: ^src/
  - repo: local
    hooks:
      - id: srd-compliance
        name: SRD compliance check
        entry: scripts/pre-commit-compliance.sh
        language: script
        files: \.(py|md|yml|yaml|toml)$
