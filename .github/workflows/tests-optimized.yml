name: Tests - Optimized (Phase 4.4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Optimize job execution with smart test selection
jobs:
  # Quick feedback stage (30-60 seconds)
  quick-feedback:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for change analysis

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: make ci-install

    - name: Run smart test selection
      run: |
        echo "=== Analyzing test impact ==="
        git diff --name-only origin/${{ github.base_ref }}...HEAD | head -20
        make test-impacted

    - name: Upload quick test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quick-test-results
        path: |
          .test-impact.json
          .test-performance-report.json
        retention-days: 7

  # Comprehensive validation stage (2-5 minutes)
  comprehensive-validation:
    runs-on: ubuntu-latest
    needs: quick-feedback
    if: always() && (needs.quick-feedback.result == 'success' || github.event_name == 'push')

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        test-category: [unit, integration, rendering, cli]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: make ci-install

    - name: Run test category with profiling
      run: |
        echo "=== Running ${{ matrix.test-category }} tests with profiling ==="
        make test-${{ matrix.test-category }}

    - name: Generate performance report
      run: |
        if [ -f .test-performance-report.json ]; then
          echo "=== Performance Summary ==="
          python -c "
          import json
          try:
              with open('.test-performance-report.json') as f:
                  report = json.load(f)
              print(f'Total tests: {report.get(\"total_tests\", 0)}')
              print(f'Total duration: {report.get(\"total_duration\", 0):.2f}s')
              slow_tests = report.get('slow_tests', [])
              if slow_tests:
                  print(f'Slow tests: {len(slow_tests)}')
                  for test in slow_tests[:3]:
                      print(f'  - {test[\"test\"].split(\"::\")[-1]}: {test[\"duration\"]:.2f}s')
          except Exception as e:
              print(f'Could not read performance report: {e}')
          "
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test-category }}-py${{ matrix.python-version }}
        path: |
          .test-performance-report.json
          .test-performance-regressions.json
        retention-days: 7

  # Performance monitoring stage
  performance-monitoring:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: make ci-install

    - name: Restore performance baseline
      uses: actions/cache/restore@v4
      id: cache-baseline
      with:
        path: .test-performance-baseline.json
        key: performance-baseline-${{ github.repository }}-main

    - name: Create baseline if missing
      if: steps.cache-baseline.outputs.cache-hit != 'true'
      run: |
        echo "=== Creating performance baseline ==="
        make test-perf-baseline

    - name: Run performance comparison
      run: |
        echo "=== Running performance monitoring ==="
        make test-profile
        make test-perf-compare || echo "Performance comparison completed"

    - name: Save performance baseline
      uses: actions/cache/save@v4
      if: steps.cache-baseline.outputs.cache-hit != 'true'
      with:
        path: .test-performance-baseline.json
        key: performance-baseline-${{ github.repository }}-main

    - name: Track performance history
      run: make test-perf-track

    - name: Comment performance results on PR
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const regressions = JSON.parse(fs.readFileSync('.test-performance-regressions.json', 'utf8'));
            if (regressions.count > 0) {
              const comment = `## ⚠️ Performance Regression Detected

              Found ${regressions.count} performance regressions:

              ${regressions.regressions.slice(0, 5).map(r =>
                `- **${r.test.split('::').pop()}**: ${r.regression_percent.toFixed(1)}% slower (${r.baseline.toFixed(3)}s → ${r.current.toFixed(3)}s)`
              ).join('\n')}

              ${regressions.count > 5 ? `\n...and ${regressions.count - 5} more regressions.` : ''}

              Please review the performance impact of your changes.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('No performance regression file found or error reading it:', error.message);
          }

  # Quality gate stage
  quality-gate:
    runs-on: ubuntu-latest
    needs: [comprehensive-validation]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: make ci-install

    - name: Run quality checks
      run: make ci-check

    - name: Generate coverage report
      run: |
        make test-unit
        make coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Quality gate summary
      run: |
        echo "=== Quality Gate Summary ==="
        echo "✓ Code quality checks passed"
        echo "✓ Security scans completed"
        echo "✓ Test coverage generated"

        # Check if any jobs failed
        VALIDATION_RESULT="${{ needs.comprehensive-validation.result }}"
        echo "Validation result: $VALIDATION_RESULT"

        if [ "$VALIDATION_RESULT" != "success" ]; then
          echo "❌ Some validation jobs failed"
          exit 1
        else
          echo "✅ All quality gates passed"
        fi

  # Legacy compatibility - run full test suite on main branch
  legacy-full-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Run full test suite
      run: make ci-test
