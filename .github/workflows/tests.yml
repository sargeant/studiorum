name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Cache LaTeX installation
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texlive
          /usr/share/texmf
          /var/lib/texmf
        key: latex-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

    - name: Install LaTeX and DND-5e-LaTeX-Template
      run: |
        # Install minimal LaTeX (much faster than texlive-full)
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
        # Clone DND-5e-LaTeX-Template to user's texmf directory
        TEXMFHOME=$(kpsewhich --var-value=TEXMFHOME)
        mkdir -p "$TEXMFHOME/tex/latex"
        git clone https://github.com/rpgtex/DND-5e-LaTeX-Template.git "$TEXMFHOME/tex/latex/dnd"
        # Update texmf database
        sudo mktexlsr
        # Verify installation
        kpsewhich dndbook.cls || echo "Warning: dndbook.cls not found in LaTeX search path"

    - name: Run fast CI checks
      run: make ci-fast

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  ci-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Run CI quality and security checks
      run: make ci-check

  ci-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Cache LaTeX installation
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texlive
          /usr/share/texmf
          /var/lib/texmf
        key: latex-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

    - name: Install LaTeX and DND-5e-LaTeX-Template
      run: |
        # Install minimal LaTeX (much faster than texlive-full)
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
        # Clone DND-5e-LaTeX-Template to user's texmf directory
        TEXMFHOME=$(kpsewhich --var-value=TEXMFHOME)
        mkdir -p "$TEXMFHOME/tex/latex"
        git clone https://github.com/rpgtex/DND-5e-LaTeX-Template.git "$TEXMFHOME/tex/latex/dnd"
        # Update texmf database
        sudo mktexlsr
        # Verify installation
        kpsewhich dndbook.cls || echo "Warning: dndbook.cls not found in LaTeX search path"

    - name: Run CI test suite with coverage
      run: make ci-test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Cache LaTeX installation
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texlive
          /usr/share/texmf
          /var/lib/texmf
        key: latex-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

    - name: Install LaTeX and DND-5e-LaTeX-Template
      run: |
        # Install minimal LaTeX (much faster than texlive-full)
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
        # Clone DND-5e-LaTeX-Template to user's texmf directory
        TEXMFHOME=$(kpsewhich --var-value=TEXMFHOME)
        mkdir -p "$TEXMFHOME/tex/latex"
        git clone https://github.com/rpgtex/DND-5e-LaTeX-Template.git "$TEXMFHOME/tex/latex/dnd"
        # Update texmf database
        sudo mktexlsr
        # Verify installation
        kpsewhich dndbook.cls || echo "Warning: dndbook.cls not found in LaTeX search path"

    - name: Install dependencies
      run: make ci-install

    - name: Run test quality analysis
      run: make test-quality

    - name: Check test quality gates
      run: make test-quality-gate

    - name: Upload test quality report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-quality-report
        path: test-quality-report.txt

  test-performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Cache LaTeX installation
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texlive
          /usr/share/texmf
          /var/lib/texmf
        key: latex-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

    - name: Install LaTeX and DND-5e-LaTeX-Template
      run: |
        # Install minimal LaTeX (much faster than texlive-full)
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
        # Clone DND-5e-LaTeX-Template to user's texmf directory
        TEXMFHOME=$(kpsewhich --var-value=TEXMFHOME)
        mkdir -p "$TEXMFHOME/tex/latex"
        git clone https://github.com/rpgtex/DND-5e-LaTeX-Template.git "$TEXMFHOME/tex/latex/dnd"
        # Update texmf database
        sudo mktexlsr
        # Verify installation
        kpsewhich dndbook.cls || echo "Warning: dndbook.cls not found in LaTeX search path"

    - name: Install dependencies
      run: make ci-install

    - name: Run fast performance tests
      run: make test-perf

    - name: Generate performance report
      run: make test-perf-report

    - name: Upload performance report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-report
        path: test-performance-report.txt

    - name: Comment performance report on PR
      uses: actions/github-script@v7
      if: always() && github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          try {
            const report = fs.readFileSync('test-performance-report.txt', 'utf8');
            const body = `## 📊 Test Performance Report\n\n\`\`\`\n${report}\n\`\`\``;

            // Check if there's already a performance comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('## 📊 Test Performance Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
          } catch (error) {
            console.log('Could not post performance report:', error);
          }
