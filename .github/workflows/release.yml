name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout recreates the pushed tag as a lightweight tag, which loses the summary in its message.
      - name: Fetch annotated tags
        run: git fetch --force --tags origin

      - name: Check the tag matches pyproject.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::pyproject.toml version ($version) != tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE-NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
