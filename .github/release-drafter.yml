name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'

template: |
  $CHANGES

# Configure categories for release notes
categories:
  - title: '✨ Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'refactor'
      - 'ci'
  - title: '📚 Documentation'
    labels:
      - 'docs'

# Exclude certain labels from appearing in the release notes
exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'
  - 'wontfix'

# Include a section for all pull requests that don't fit into a category
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

# Add a "What's Changed" section at the end
header-template: |-
  ## What's Changed

# Versioning strategy (optional, but good for clarity)
# If you want to automatically bump the version based on labels, you can add:
# version-resolver:
#   major:
#     labels: ['major']
#   minor:
#     labels: ['minor']
#   patch:
#     labels: ['patch']
#   default: patch
