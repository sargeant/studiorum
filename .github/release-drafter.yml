# Release Drafter provides content only - versions are set manually via bump_version.py
# These templates are not used since releases are created manually
name-template: 'Manual Release'
tag-template: 'manual'

# Content template for manual release creation
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$NEW_TAG

# Configure categories for release notes (enhanced for conventional commits)
categories:
  - title: '✨ New Features'
    labels:
      - 'feature'
      - 'enhancement'
    # Match conventional commit types
    commit-title-pattern: '^feat(\(.*\))?: .*'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
    commit-title-pattern: '^fix(\(.*\))?: .*'
  - title: '📚 Documentation'
    labels:
      - 'docs'
      - 'documentation'
    commit-title-pattern: '^docs(\(.*\))?: .*'
  - title: '🧰 Maintenance & Refactoring'
    labels:
      - 'chore'
      - 'dependencies'
      - 'refactor'
      - 'ci'
    commit-title-pattern: '^(chore|refactor)(\(.*\))?: .*'
  - title: '🧪 Testing'
    labels:
      - 'test'
      - 'testing'
    commit-title-pattern: '^test(\(.*\))?: .*'
  - title: '💄 Style & Formatting'
    labels:
      - 'style'
    commit-title-pattern: '^style(\(.*\))?: .*'

# Exclude certain labels from appearing in the release notes
exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'
  - 'wontfix'

# Enhanced change template with better formatting
change-template: |
  - $TITLE @$AUTHOR (#$NUMBER)

# Better change title pattern to clean up conventional commit titles
change-title-escapes: '\<*_&'

# Auto-labeling based on conventional commit patterns
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?: .*/'
  - label: 'enhancement'
    title:
      - '/^feat(\(.*\))?: .*/'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?: .*/'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?: .*/'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?: .*/'
  - label: 'refactor'
    title:
      - '/^refactor(\(.*\))?: .*/'
  - label: 'test'
    title:
      - '/^test(\(.*\))?: .*/'
  - label: 'style'
    title:
      - '/^style(\(.*\))?: .*/'
  - label: 'breaking'
    title:
      - '/^.*!(\(.*\))?: .*/'
      - '/.*BREAKING CHANGE.*/'

# Version resolution disabled - using manual versioning via bump_version.py
# The categories and autolabeler below are used purely for organizing release notes

# Better sorting of changes
sort-by: title
sort-direction: ascending

# Template for individual changes to clean up conventional commit titles
replacers:
  - search: '/^feat(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^fix(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^docs(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^chore(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^refactor(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^test(\(.*\))?: (.*)/'
    replace: '$2'
  - search: '/^style(\(.*\))?: (.*)/'
    replace: '$2'
